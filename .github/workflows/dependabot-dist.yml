name: Dependabot dist

# When Dependabot bumps a bundled runtime dependency, package.json/lock change
# but dist/index.js does not — which would fail CI's "dist up to date" check.
# This workflow rebuilds the bundle and commits it back to the PR branch so the
# update can be merged hands-free.

on:
  pull_request:

# The permissions key is honored for Dependabot-triggered runs, granting the
# (otherwise read-only) token write access so it can push to the PR branch.
permissions:
  contents: write

jobs:
  rebuild-dist:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }} # check out the PR branch (not the merge ref) so we can push
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit rebuilt dist if it changed
        run: |
          if [ -z "$(git status --porcelain dist)" ]; then
            echo "dist/ is already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: rebuild dist after dependency update"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "Pushed rebuilt dist to ${{ github.head_ref }}."
