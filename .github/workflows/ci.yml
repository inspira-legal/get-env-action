name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build bundle
        run: npm run build

      # Fail if the committed dist/ is stale relative to src/.
      # Skipped for Dependabot — the "Dependabot dist" workflow rebuilds and
      # commits dist/ on those PRs instead of failing them.
      - name: Verify dist is up to date
        if: github.actor != 'dependabot[bot]'
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat dist
            exit 1
          fi
