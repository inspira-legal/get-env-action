name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# semantic-release needs to push the version commit + tags and create releases.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags for commit analysis
          persist-credentials: true # reused by the major-tag push

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # --- CI gate: must pass before anything is published ---
      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verify dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat dist
            exit 1
          fi

      # --- Publish (only reached if every step above passed) ---
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
